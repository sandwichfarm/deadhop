# Production deployment: the payment service, an offline wallet service and
# the dashboard.
#
# The payment service has no inbound port: it reaches out to Nostr relays and
# to your Electrum server. It is watch-only and never holds a spending key.
# Only the dashboard (static files) is served over HTTP; TLS for it is
# terminated by the reverse proxy in front (Coolify/Traefik).
#
# Wallet: leave CVMPAY_XPUB unset and the `wallet` service (no network at all)
# generates a wallet on first start, keeps its recovery phrase in its own
# volume and hands only the public key to the payment service. Back up the
# phrase with `docker compose exec wallet cvmpay wallet export`. Or set
# CVMPAY_XPUB to your own wallet's account key and nothing is generated.
#
# Every variable is passed through empty when unset, which the service treats
# as unset. CVMPAY_ELECTRUM and CVMPAY_ADMINS (or CVMPAY_PUBLIC_INVOICING=true)
# are required: without them the service exits with a message naming the
# missing variable and is restarted until they are set. The dashboard comes up
# regardless.
services:
  wallet:
    build:
      context: ./server
    command: ["wallet", "serve"]
    restart: unless-stopped
    network_mode: none
    environment:
      CVMPAY_XPUB: "${CVMPAY_XPUB:-}"
      CVMPAY_NETWORK: "${CVMPAY_NETWORK:-bitcoin}"
      CVMPAY_DATA_DIR: /wallet
      CVMPAY_XPUB_FILE: /wallet-public/account.xpub
      TOKIO_WORKER_THREADS: "1"
    volumes:
      - cvmpay-wallet:/wallet
      - cvmpay-wallet-public:/wallet-public
    healthcheck:
      test: ["CMD", "test", "-e", "/wallet-public/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    labels:
      - traefik.enable=false

  cvmpay:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      CVMPAY_RELAYS: "${CVMPAY_RELAYS:-wss://relay.contextvm.org,wss://nos.lol,wss://relay.damus.io}"
      CVMPAY_ELECTRUM: "${CVMPAY_ELECTRUM:-}"
      CVMPAY_ELECTRUM_CERT_SHA256: "${CVMPAY_ELECTRUM_CERT_SHA256:-}"
      CVMPAY_XPUB: "${CVMPAY_XPUB:-}"
      CVMPAY_NETWORK: "${CVMPAY_NETWORK:-bitcoin}"
      CVMPAY_ADMINS: "${CVMPAY_ADMINS:-}"
      CVMPAY_PUBLIC_INVOICING: "${CVMPAY_PUBLIC_INVOICING:-}"
      CVMPAY_POW_BITS: "${CVMPAY_POW_BITS:-}"
      CVMPAY_MIN_CONFIRMATIONS: "${CVMPAY_MIN_CONFIRMATIONS:-}"
      CVMPAY_PROXY: "${CVMPAY_PROXY:-}"
      CVMPAY_PROXY_LOCKED: "${CVMPAY_PROXY_LOCKED:-}"
      CVMPAY_NAME: "${CVMPAY_NAME:-}"
      CVMPAY_ANNOUNCE: "${CVMPAY_ANNOUNCE:-}"
      CVMPAY_LOG: "${CVMPAY_LOG:-}"
      CVMPAY_DEFAULT_EXPIRY_SECS: "${CVMPAY_DEFAULT_EXPIRY_SECS:-}"
      CVMPAY_LATE_GRACE_SECS: "${CVMPAY_LATE_GRACE_SECS:-}"
      CVMPAY_MAX_AMOUNT_SAT: "${CVMPAY_MAX_AMOUNT_SAT:-}"
      CVMPAY_MAX_EXPIRY_SECS: "${CVMPAY_MAX_EXPIRY_SECS:-}"
      CVMPAY_MAX_INVOICES_PER_DAY: "${CVMPAY_MAX_INVOICES_PER_DAY:-}"
      CVMPAY_MAX_OPEN_INVOICES: "${CVMPAY_MAX_OPEN_INVOICES:-}"
      CVMPAY_MIN_AMOUNT_SAT: "${CVMPAY_MIN_AMOUNT_SAT:-}"
      CVMPAY_POLL_SECS: "${CVMPAY_POLL_SECS:-}"
      CVMPAY_POW_WINDOW_SECS: "${CVMPAY_POW_WINDOW_SECS:-}"
      CVMPAY_RATE_GLOBAL_PER_MIN: "${CVMPAY_RATE_GLOBAL_PER_MIN:-}"
      CVMPAY_RATE_PER_KEY_PER_MIN: "${CVMPAY_RATE_PER_KEY_PER_MIN:-}"
      CVMPAY_RATE_REQUESTS_PER_KEY_PER_MIN: "${CVMPAY_RATE_REQUESTS_PER_KEY_PER_MIN:-}"
      CVMPAY_RATE_REQUESTS_PER_MIN: "${CVMPAY_RATE_REQUESTS_PER_MIN:-}"
      CVMPAY_DATA_DIR: /data
      CVMPAY_XPUB_FILE: /wallet-public/account.xpub
    depends_on:
      wallet:
        condition: service_healthy
    volumes:
      - cvmpay-data:/data
      - cvmpay-public:/public
      - cvmpay-wallet-public:/wallet-public:ro
    # Healthy once the service has connected to its relays and is serving
    # (it writes server.pubkey into the data directory at that point).
    healthcheck:
      test: ["CMD", "test", "-s", "/data/server.pubkey"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 3
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    labels:
      - traefik.enable=false

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      cvmpay:
        condition: service_started
    environment:
      CVMPAY_RELAYS: "${CVMPAY_RELAYS:-wss://relay.contextvm.org,wss://nos.lol,wss://relay.damus.io}"
      CVMPAY_DASHBOARD_RELAYS: "${CVMPAY_DASHBOARD_RELAYS:-}"
    expose:
      - "8080"
    volumes:
      - cvmpay-public:/public:ro
    tmpfs:
      - /tmp:size=4m,uid=101,gid=101,mode=0755
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/config.json"]
      interval: 15s
      timeout: 3s
      start_period: 150s
      retries: 3

volumes:
  cvmpay-data:
  cvmpay-public:
  cvmpay-wallet:
  cvmpay-wallet-public:
