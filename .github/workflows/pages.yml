# Builds the landing page and docs (site/) and publishes them to GitHub Pages.
# The Pages URL, including its path (https://sandwichfarm.github.io/deadhop/,
# or a custom domain once one is set), comes from the Pages settings and
# becomes SITE_URL, so canonical links, the sitemap and llms.txt point there.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check (links, metadata, llms.txt, sitemap)
        run: npm run check
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
